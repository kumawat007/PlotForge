name: 💡 Feature Request
description: Propose a new feature, font, or printer preset for PlotForge
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make PlotForge even better? We'd love to hear your proposal!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature related to a problem?
      description: A clear and concise description of the limitation or need.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought about.
